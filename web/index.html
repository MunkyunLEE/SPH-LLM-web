<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPH-LLM-web</title>
<link rel="stylesheet" href="/core/style.css">
<link rel="stylesheet" href="style.css">
<script type="importmap">{"imports": {"three": "/core/vendor/three.module.js"}}</script>
</head>
<body>
<div id="app">
  <aside id="left">
    <header><h1>SPH<span>·LLM</span></h1><div id="tools"></div></header>
    <section>
      <h2>지오메트리</h2>
      <div class="row"><select id="example"><option value="">예제 선택…</option></select></div>
      <div class="row two"><button id="loadPreset">예제 + 조건</button><button id="loadGeo" class="ghost">지오메트리만</button></div>
      <label class="file"><input type="file" id="file" accept=".obj,.stl"><span>OBJ / STL 올리기</span></label>
      <div class="row two"><label>파일 단위<select id="fileUnit"><option value="mm">mm</option><option value="cm">cm</option><option value="m">m</option><option value="inch">inch</option></select></label><span></span></div>
      <div id="modelInfo" class="info">불러온 모델이 없습니다</div>
    </section>
    <section>
      <h2>유체 · 입자 <small>mm · tonne · s · MPa</small></h2>
      <div class="row two"><label>유체<select id="fluidPreset"><option value="water">물 20°C</option><option value="air">공기 20°C</option><option value="oil">윤활유</option><option value="custom">직접 입력</option></select></label><label>입자 간격 dx (mm)<input id="dx" type="number" step="any" min="0"></label></div>
      <div class="row two"><label>ρ₀ (tonne/mm³)<input id="rho0" type="number" step="any"></label><label>μ (MPa·s)<input id="mu" type="number" step="any"></label></div>
      <div id="estimate" class="info"></div>
    </section>
    <section>
      <h2>해석</h2>
      <div class="row two"><label>경계 조건<select id="boundary"><option value="mdbc">mDBC (정밀)</option><option value="dbc">DBC (빠름)</option></select></label><label>계산 장치<select id="device"><option value="auto">자동</option><option value="cuda">CUDA</option><option value="metal">Metal</option><option value="vulkan">Vulkan</option><option value="cpu">CPU</option></select></label></div>
      <div class="row two"><label>점성<select id="viscosity"><option value="artificial">인공 점성 α</option><option value="laminar">층류 (μ 사용)</option></select></label><label>α<input id="alpha" type="number" step="0.005" min="0"></label></div>
      <div class="row three"><label>해석 시간 (s)<input id="tEnd" type="number" step="any" min="0"></label><label>출력 (프레임/s)<input id="fps" type="number" step="1" min="1"></label><label>CFL<input id="cfl" type="number" step="0.05" min="0" max="1"></label></div>
      <div class="row two"><label>중력 z (mm/s²)<input id="gz" type="number" step="any"></label><span></span></div>
    </section>
    <section>
      <h2>해석 영역 <small>밖으로 나간 입자는 제거</small></h2>
      <div class="row three"><label>x 최소<input id="dx0" type="number" step="any"></label><label>y 최소<input id="dy0" type="number" step="any"></label><label>z 최소<input id="dz0" type="number" step="any"></label></div>
      <div class="row three"><label>x 최대<input id="dx1" type="number" step="any"></label><label>y 최대<input id="dy1" type="number" step="any"></label><label>z 최대<input id="dz1" type="number" step="any"></label></div>
      <div class="row"><button id="fitDomain" class="ghost">내용에 맞춤</button></div>
    </section>
    <section>
      <h2>물체 <small id="bdCount"></small></h2>
      <div id="bdList" class="list"></div>
      <h2>유체 블록 <small id="fbCount"></small></h2>
      <div id="fbList" class="list"></div>
      <h2>유입구 <small id="inCount"></small></h2>
      <div id="inList" class="list"></div>
      <h2>유출 영역 <small id="outCount"></small></h2>
      <div id="outList" class="list"></div>
      <h2>프로브 <small id="moCount"></small></h2>
      <div id="moList" class="list"></div>
      <div class="row three"><label>x<input id="prX" type="number" step="any"></label><label>y<input id="prY" type="number" step="any"></label><label>z<input id="prZ" type="number" step="any"></label></div>
      <div class="row"><button id="prAdd" class="ghost">프로브 추가</button></div>
      <h2>정지 조건 <small id="stCount"></small></h2>
      <div id="stList" class="list"></div>
      <div id="warnings"></div>
      <div class="row"><button id="undo" class="ghost" type="button" disabled>되돌리기</button></div>
    </section>
    <section class="run">
      <button id="solve" class="primary">해석 실행</button>
      <div class="row three"><button id="pause" class="ghost" disabled>일시정지</button><button id="stepOne" class="ghost" disabled>한 스텝</button><button id="stopRun" class="ghost" disabled>정지</button></div>
      <div class="progress"><div id="runBar"></div></div>
      <div id="runState" class="info"></div>
      <button id="pack" class="ghost" hidden>Rhino 용 결과 (npz)</button>
      <div class="row two"><a id="expSpec" class="btn ghost" href="/api/export/spec">케이스 JSON</a><label class="btn ghost file-btn">케이스 불러오기<input id="impSpec" type="file" accept=".json" hidden></label></div>
      <div id="solveMsg" class="info"></div>
    </section>
    <section>
      <h2>결과 표시 <small>계산 중에도 갱신</small></h2>
      <div class="row two"><label>색 범위<select id="rangeMode"><option value="frame">프레임마다</option><option value="fixed">고정</option></select></label><label>입자 크기<input id="psize" type="number" min="1" max="10" value="3"></label></div>
      <div class="row two"><label class="check"><input type="checkbox" id="showPart" checked>입자</label><span></span></div>
      <div class="slicerow"><label class="check"><input type="checkbox" id="slX">X 단면</label><input id="slXv" type="range" min="0" max="1000" value="500"></div>
      <div class="slicerow"><label class="check"><input type="checkbox" id="slY">Y 단면</label><input id="slYv" type="range" min="0" max="1000" value="500"></div>
      <div class="slicerow"><label class="check"><input type="checkbox" id="slZ">Z 단면</label><input id="slZv" type="range" min="0" max="1000" value="200"></div>
      <div class="row three"><label class="check"><input type="checkbox" id="showVec">벡터</label><label>간격<input id="vecStride" type="number" min="1" max="20" value="2"></label><span></span></div>
      <div class="row three"><label class="check"><input type="checkbox" id="showStream">유선</label><label>단면<select id="streamPlane"><option value="Y">Y</option><option value="X">X</option><option value="Z">Z</option></select></label><label>밀도<input id="streamDens" type="number" min="1" max="10" value="4"></label></div>
      <div class="row three"><label class="check"><input type="checkbox" id="showIso">Q 등치면</label><label>Q 수준 %<input id="qLevel" type="number" min="0.5" max="100" step="0.5" value="8"></label><span></span></div>
      <div id="isoInfo" class="info"></div>
    </section>
  </aside>
  <main>
    <div id="viewer">
      <canvas id="gl"></canvas>
      <canvas id="gizmo" width="96" height="96"></canvas>
      <div id="hud"></div>
      <div id="legend" hidden><div id="legendTitle"></div><div id="legendBar"></div><div id="legendTicks"></div></div>
      <div id="viewbar">
        <button id="fit" title="화면 맞춤">맞춤</button>
        <label class="check"><input type="checkbox" id="showModel" checked>형상</label>
        <label class="check"><input type="checkbox" id="showEdges" checked>요소 경계</label>
        <label class="check"><input type="checkbox" id="showSymbols" checked>영역·유입구</label>
        <label class="check"><input type="checkbox" id="showPreview" checked>입자 미리보기</label>
      </div>
      <div id="resultbar" hidden>
        <button id="play">▶</button>
        <input id="frame" type="range" min="0" max="0" value="0">
        <span id="frameLabel"></span>
        <select id="field"></select>
      </div>
    </div>
    <div id="bottom">
      <div id="summary"></div>
      <div id="plots"></div>
    </div>
  </main>
  <aside id="right"></aside>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
